appId: com.trace.notes
productName: Trace
copyright: Copyright © 2026 Trace

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - "!resources/**"

# 注意：extraResources 必须在每个平台段内分别声明——平台段会覆盖顶层同名配置，
# 顶层声明在平台构建（--win / --linux / --mac）时会被整个丢弃。

asar: true

linux:
  icon: build/icon.png
  category: Utility
  maintainer: trace
  artifactName: linux-v${version}-x64.${ext}
  extraResources:
    - from: resources/sample-plugin
      to: sample-plugin
    # 内置 Git（FR-2.8.13）：需先执行 npm run fetch:git 生成 vendor/git/linux
    - from: vendor/git/linux
      to: git
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64

win:
  icon: build/icon.png
  artifactName: win-v${version}-x64.${ext}
  extraResources:
    - from: resources/sample-plugin
      to: sample-plugin
    # 内置 Git（FR-2.8.13）：需先执行 npm run fetch:git 生成 vendor/git/win32
    - from: vendor/git/win32
      to: git
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  extraResources:
    - from: resources/sample-plugin
      to: sample-plugin
    # macOS 仅支持源码构建，不内置 Git；运行时回落到系统 git（见 bundled-git-design.md 3.5）
  target:
    - dmg
