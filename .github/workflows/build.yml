name: Build & Release Trace App

on:
  push:
    tags:
      - 'v*.*.*'          # 推送版本标签时触发构建 + 发布
  workflow_dispatch:       # 支持手动触发（可对任意分支构建测试安装包）

jobs:
  build:
    strategy:
      fail-fast: false     # 某个平台失败不影响其他平台继续构建
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
        # macOS 不提供预构建安装包，用户需自行从源码构建（见 README）

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 3.5 版本一致性校验：tag 发布必须与 package.json 同版本
      #     （关于页版本号与安装包文件名均源自 package.json，tag 是唯一人工环节）
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash            # Windows runner 默认 pwsh，bash 语法必须显式声明
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          echo "package.json -> $PKG_TAG / git tag -> $GITHUB_REF_NAME"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $PKG_TAG 不一致，请先更新版本号（npm version <x.y.z>）再打标签"
            exit 1
          fi

      # 4. 构建应用产物（electron-vite → out/，out/ 不入库，必须在此生成）
      - name: Build app bundles
        run: npm run build

      # 5. 打包对应平台的安装包
      - name: Build for ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # 6. 读取应用版本号（供工件命名）
      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 7. 上传构建产物（命名规范：平台-v版本-架构；下载时由 GitHub 打包为 zip）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trace-${{ matrix.platform }}-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  # 仅在推送版本标签时执行发布
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载所有平台的构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 创建 GitHub Release 并上传所有安装包
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}