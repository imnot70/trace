name: Build & Release Trace App

on:
  push:
    tags:
      - 'v*.*.*'          # 推送版本标签时触发构建 + 发布
  workflow_dispatch:       # 支持手动触发（可对任意分支构建测试安装包）

jobs:
  build:
    strategy:
      fail-fast: false     # 某个平台失败不影响其他平台继续构建
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
        # macOS 不提供预构建安装包，用户需自行从源码构建（见 README）

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 3.5 版本一致性校验：tag 发布必须与 package.json 同版本
      #     （关于页版本号与安装包文件名均源自 package.json，tag 是唯一人工环节）
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash            # Windows runner 默认 pwsh，bash 语法必须显式声明
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          echo "package.json -> $PKG_TAG / git tag -> $GITHUB_REF_NAME"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $PKG_TAG 不一致，请先更新版本号（npm version <x.y.z>）再打标签"
            exit 1
          fi

      # 4. 构建应用产物（electron-vite → out/，out/ 不入库，必须在此生成）
      - name: Build app bundles
        run: npm run build

      # 4.5 缓存内置 Git：key 关联 fetch 脚本（版本与 SHA256 pin 在其中），
      #     改动 pin 会自动失效重取
      - name: Cache bundled Git
        uses: actions/cache@v4
        with:
          path: vendor/git
          key: bundled-git-${{ runner.os }}-${{ hashFiles('scripts/fetch-git.mjs') }}

      # 4.6 获取内置 Git（FR-2.8.13）：下载 + SHA256 校验 + 解压到 vendor/git/<platform>。
      #     vendor/ 不入库，必须在 electron-builder 之前生成，否则安装包缺失内置 git。
      #     不传 --platform：脚本默认取宿主平台，与 matrix 的构建目标一致
      - name: Fetch bundled Git
        run: npm run fetch:git

      # 5. 打包对应平台的安装包
      - name: Build for ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # 6. 读取应用版本号（供工件命名）
      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 7. 上传构建产物（下载时由 GitHub 打包为 zip）
      #    只上传安装包本体——latest*.yml / *.blockmap 是 electron-builder 自动更新的
      #    元数据，应用尚未实现自动更新，不随工件/Release 分发
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trace-${{ matrix.platform }}-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage

  # 仅在推送版本标签时执行发布
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载所有平台的构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 创建 GitHub Release 并上传所有安装包
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 插件类型包 trace-plugin-api 自动发布：npm Trusted Publishing（OIDC，免 token）
  # 前提（一次性，npmjs.com 手动配置）：trace-plugin-api → Settings → Trusted Publisher
  #   登记为 imnot70 / trace / build.yml（环境留空）。见 guides/plugin-development.md 第 9 节。
  # 仅当本地版本 ≠ npm 线上版本时才发布——应用发版不必然携带类型包变更，版本相同则跳过
  publish-plugin-api:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC 令牌：Trusted Publishing 必需
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted Publishing 要求 npm >= 11.5.1（Node 22 自带的 npm 10.x 不满足）
      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest

      # 与 npm 线上版本比对：不同（通常是更高）才发布
      - name: Compare local version with npm registry
        id: version
        run: |
          LOCAL="$(node -p "require('./packages/plugin-api/package.json').version")"
          PUBLISHED="$(npm view trace-plugin-api version 2>/dev/null || true)"
          echo "本地版本: $LOCAL / npm 线上版本: ${PUBLISHED:-（未发布）}"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish trace-plugin-api to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/plugin-api
        run: npm publish